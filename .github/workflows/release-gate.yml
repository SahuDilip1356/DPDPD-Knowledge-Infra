name: release-gate

# Nothing reaches a preview without passing this, and nothing reaches
# production without a founder-verified preview (preview-before-prod).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  wiki:
    name: DPDPA Wiki — build, citation guard, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployments/dpdpa-wiki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deployments/dpdpa-wiki/package-lock.json
      - run: npm ci
      - name: Build (citation guard, client, SSR, prerender)
        run: npm run build
      - name: Tests over the built HTML and data
        run: npx vitest run
      - name: Lint
        run: npx oxlint src

  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployments/dpdpa-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deployments/dpdpa-backend/requirements.txt
      - run: pip install -r requirements.txt httpx
      - name: Unit and API tests (no network; sockets are blocked in conftest)
        run: python -m pytest -q -p no:cacheprovider

  evals:
    name: Evals — offline, against the deployed backend
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deployments/dpdpa-backend/requirements.txt
      - run: pip install -r deployments/dpdpa-backend/requirements.txt httpx
      - name: Offline eval run (synthetic corpus, mock model — a regression check, not a quality claim)
        run: python evals/runner.py --offline --runs 1
      - name: Real-corpus eval tests (no network)
        run: python -m pytest -q -p no:cacheprovider evals/test_real_corpus.py
      - name: Real-corpus offline eval (verified law + 511 answer objects, mock model; citation invariants, metrics held to baseline)
        run: python evals/runner.py --corpus real --offline --runs 1
